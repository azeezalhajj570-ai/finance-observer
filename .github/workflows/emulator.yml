name: Build & Run on Cloud Emulator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    strategy:
      matrix:
        api-level: [34]
        target: [google_apis]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build project
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create AVD and run emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          avd-name: ci-emulator
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -cache-size 512
          disable-animations: true
          script: |
            # Wait for the device
            adb wait-for-device
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0

            # Install the debug APK
            echo "=== Installing APK ==="
            adb install -t app/build/outputs/apk/debug/app-debug.apk

            # Launch the app
            echo "=== Launching app ==="
            adb shell am start -n com.financeobserver/.ui.MainActivity

            # Wait for app to render
            sleep 5

            # Take a screenshot to verify it launched
            echo "=== Taking screenshot ==="
            adb shell screencap /sdcard/screenshot.png
            adb pull /sdcard/screenshot.png app-screenshot.png

            # Dump UI hierarchy
            echo "=== UI dump ==="
            adb shell uiautomator dump /sdcard/ui.xml
            adb pull /sdcard/ui.xml ui.xml

            # Run instrumentation tests
            echo "=== Running instrumentation tests ==="
            adb shell am instrument -w com.financeobserver.test/androidx.test.runner.AndroidJUnitRunner

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results-${{ matrix.api-level }}
          path: |
            app-screenshot.png
            ui.xml
            app/build/outputs/
          if-no-files-found: ignore
